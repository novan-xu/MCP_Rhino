<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rhino Agent Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="header" id="header">
      <div class="header-brand">
        <div class="header-brand-mark"></div>
        <div class="header-brand-name">rhino<span>·</span>agent</div>
      </div>

      <div class="mcp-pill is-connecting" id="mcpPill" title="MCP connection">
        <span class="mcp-dot"></span>
        <span id="mcpLabel">MCP</span>
      </div>

      <div class="header-title" id="headerTitle" hidden></div>
      <div class="header-spacer" id="headerSpacer"></div>

      <button class="rh-btn-icon rh-btn-icon--lg" id="historyButton" type="button" title="Chat history">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>

      <button class="rh-btn-icon rh-btn-icon--lg" id="newChatButton" type="button" title="New chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <button class="rh-btn-icon rh-btn-icon--lg" id="settingsButton" type="button" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>

      <button class="rh-btn-icon rh-btn-icon--lg" id="pinButton" type="button" title="Pin (always-on-top)">
        <svg id="pinIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M12 2v3"/><path d="M5 9h14l-1 2.5"/><path d="M9 14H7l-2 -5"/><path d="M12 14v8"/></svg>
      </button>
    </header>

    <section class="transcript rh-scroll" id="transcript" aria-live="polite"></section>

    <div class="composer">
      <div class="chip-row above-input" id="attachmentChips" hidden></div>

      <div class="composer-box" id="composerBox">
        <button class="composer-attach" id="attachButton" type="button" title="Attach file">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg>
        </button>
        <textarea class="composer-input" id="composerInput" rows="1" placeholder="Ask, build, modify… (⏎ send · ⇧⏎ newline · drop files)"></textarea>
        <button class="composer-send" id="sendButton" type="button" title="Send">
          <svg id="sendIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14-7-5 16-3-7-6-2z"/></svg>
        </button>
      </div>

      <div class="composer-hint">
        <kbd class="rh-kbd">⏎</kbd><span>send</span>
        <kbd class="rh-kbd">⇧⏎</kbd><span>newline</span>
        <span class="spacer"></span>
        <span>drop files anywhere</span>
      </div>
    </div>

    <div class="statusbar">
      <div class="ctx" id="ctxMeter" title="Context tokens used">
        <svg id="ctxDonut" width="20" height="20" viewBox="0 0 18 18">
          <circle cx="9" cy="9" r="7" fill="none" stroke="var(--border)" stroke-width="2"></circle>
          <circle id="ctxArc" cx="9" cy="9" r="7" fill="none" stroke="var(--accent)" stroke-width="2"
                  stroke-dasharray="0 44" transform="rotate(-90 9 9)" stroke-linecap="butt"></circle>
        </svg>
        <span class="used" id="ctxUsed">0</span>
        <span>/</span>
        <span id="ctxTotal">200k</span>
        <span class="ctx-label">ctx</span>
      </div>
      <div class="sep"></div>
      <div class="cost" title="Estimated cost · based on token usage and the selected model's published price">$ <span class="cost-value" id="costValue">0.0000</span></div>
      <div class="spacer"></div>
      <div class="model-echo" id="modelEcho">Default</div>
    </div>

    <div class="drag-overlay" id="dragOverlay">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/></svg>
      <div class="drag-title">drop to attach</div>
      <div class="drag-detail">images, .3dm, .gh, .py, .txt</div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
      <div class="settings-card" id="settingsCard">
        <div class="settings-head">
          <span class="settings-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-faint)"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            settings
          </span>
          <span class="spacer"></span>
          <button class="rh-btn-icon" id="settingsCloseButton" type="button" title="Close">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>

        <div class="settings-body rh-scroll">
          <div class="settings-field">
            <div class="settings-field-label">Backend CLI</div>
            <div class="settings-choices" id="cliChoices"></div>
          </div>

          <div class="settings-field">
            <div class="settings-field-label">Model</div>
            <div class="settings-choices" id="modelChoices"></div>
          </div>

          <div class="settings-field">
            <div class="settings-field-label">MCP server</div>
            <div class="mcp-readout" id="mcpReadout">
              <span class="dot"></span>
              <span class="name">rhino-mcp</span>
              <span class="sep">·</span>
              <span class="pipe" id="mcpPipe">starting…</span>
              <span class="spacer"></span>
              <span class="meta" id="mcpMeta"></span>
            </div>
          </div>
        </div>

        <div class="settings-foot">
          <button class="settings-done" id="settingsDoneButton" type="button">Done</button>
        </div>
      </div>
    </div>

    <div class="history-overlay" id="historyOverlay">
      <div class="history-card" id="historyCard">
        <div class="history-head">
          <span class="history-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-faint)"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
            chat history
            <span class="history-count" id="historyCount">· 0</span>
          </span>
          <span class="spacer"></span>
          <button class="rh-btn-icon" id="historyCloseButton" type="button" title="Close">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>

        <div class="history-search">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-faint)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <input id="historySearch" type="text" placeholder="Search sessions…" autocomplete="off">
          <button class="rh-btn-ghost" id="historySearchClear" type="button" hidden>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>

        <div class="history-body rh-scroll" id="historyBody"></div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
